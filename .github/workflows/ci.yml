name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to publish
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Wire contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install contract validator
        run: npm ci

      - name: Validate Schemas, Fixtures, and Swift DTOs
        run: npm test

  swift:
    name: Swift tests and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test --parallel

      - name: Build release product
        run: swift build -c release

  kotlin:
    name: Kotlin tests and publication build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Kotlin tests
        run: ./gradlew :AstrolabeProtocolKotlin:test

      - name: Build Kotlin publication
        run: ./gradlew :AstrolabeProtocolKotlin:publishToMavenLocal

  publish-kotlin:
    name: Publish Kotlin artifact
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - contract
      - swift
      - kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify release tag
        run: >-
          node -e 'const version = require("./package.json").version;
          if (process.env.RELEASE_TAG !== version) {
          throw new Error(`Tag ${process.env.RELEASE_TAG} does not match version ${version}`);
          }'
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish and release Kotlin artifact
        run: >-
          ./gradlew
          --no-configuration-cache
          :AstrolabeProtocolKotlin:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
